version: '3.9'

services:
  api-gateway:
    image: nginx:1.25-alpine
    container_name: roomia-api-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - identity-service
      - catalog-service
      - search-service
      - booking-payment-service
      - review-service
      - audit-service
    networks:
      - roomia-network

  identity-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomia-identity-service
    environment:
      SERVICE_NAME: identity-service
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    networks:
      - roomia-network

  catalog-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomia-catalog-service
    environment:
      SERVICE_NAME: catalog-service
    env_file:
      - .env.example
    depends_on:
      - postgres
    networks:
      - roomia-network

  search-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomia-search-service
    environment:
      SERVICE_NAME: search-service
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    networks:
      - roomia-network

  booking-payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomia-booking-payment-service
    environment:
      SERVICE_NAME: booking-payment-service
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    networks:
      - roomia-network

  review-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomia-review-service
    environment:
      SERVICE_NAME: review-service
    env_file:
      - .env.example
    depends_on:
      - postgres
    networks:
      - roomia-network

  audit-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomia-audit-service
    environment:
      SERVICE_NAME: audit-service
    env_file:
      - .env.example
    depends_on:
      - postgres
    networks:
      - roomia-network

  frontend:
    image: node:20-alpine
    container_name: roomia-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - roomia-network

  postgres:
    image: postgres:16-alpine
    container_name: roomia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomia_db
      POSTGRES_USER: roomia_app_user
      POSTGRES_PASSWORD: local_dev_password_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/database/postgresql:/docker-entrypoint-initdb.d:ro
    networks:
      - roomia-network

  redis:
    image: redis:7.2-alpine
    container_name: roomia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - roomia-network

volumes:
  postgres-data:

networks:
  roomia-network:
    driver: bridge
