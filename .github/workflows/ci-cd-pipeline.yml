name: Roomia Quality Gate & CI/CD Pipeline (v3.2.0)

on:
  push:
    branches: [ main, staging, develop, 'feature/**' ]
  pull_request:
    branches: [ main, staging, develop ]

jobs:
  lint-and-static-analysis:
    name: Stage 1 - Static Security & TypeScript Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Zero Hardcoded Live Secrets (R-DEV-02)
        run: |
          if grep -rnE "(sk_live_|rk_live_|AKIA[0-9A-Z]{16})" backend/ frontend/ frontend-admin/; then
            echo "ERROR: Hardcoded production secret detected"
            exit 1
          fi
      - name: Build & Typecheck Public Portal (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build & Typecheck Admin Backoffice (frontend-admin)
        working-directory: frontend-admin
        run: |
          npm ci
          npm run build

  automated-postgresql-audit:
    name: Stage 2 - Automated End-to-End PostgreSQL Audit Suite (15 Controls)
    needs: lint-and-static-analysis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: RoomiaAdmin2026!
          POSTGRES_DB: roomia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Backend Dependencies (pg)
        working-directory: backend
        run: npm ci
      - name: Create Least-Privilege App Role & Run 15-Control PostgreSQL Audit Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: roomia_db
          DB_USERNAME: roomia_app_user
          DB_PASSWORD: RoomiaApp2026!
          PG_SUPERUSER: postgres
          PG_SUPERUSER_PASSWORD: RoomiaAdmin2026!
          ROOMIA_JWT_SECRET: ci_ephemeral_jwt_secret_v320
          STRIPE_WEBHOOK_SECRET: whsec_ci_ephemeral_v320
        run: |
          PGPASSWORD=RoomiaAdmin2026! psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE roomia_app_user WITH LOGIN PASSWORD 'RoomiaApp2026!';"
          node backend/tests/run_audit_suite.mjs
